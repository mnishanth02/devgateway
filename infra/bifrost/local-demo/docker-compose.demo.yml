# DevGateway local gateway live-traffic demo (LOCAL ONLY, fully isolated).
#
# This compose project is SEPARATE from the fail-closed `docker-compose.local.yml`
# Bifrost service and from the `pnpm local:*` launcher. It does NOT touch the
# committed runtime config, registry/policy production flags, break-glass, or
# production provisioning. It uses a synthetic local mock upstream and NO real
# provider keys, so it proves the gateway data-plane plumbing without enabling
# any production route.
#
# Run:   docker compose -f infra/bifrost/local-demo/docker-compose.demo.yml up -d
# Stop:  docker compose -f infra/bifrost/local-demo/docker-compose.demo.yml down
name: devgateway-gateway-demo

services:
  mock-openai:
    image: node:22-alpine
    command: ["node", "/app/mock-openai-server.mjs"]
    environment:
      MOCK_OPENAI_PORT: "8081"
      MOCK_OPENAI_HOST: "0.0.0.0"
    volumes:
      - ./mock-openai-server.mjs:/app/mock-openai-server.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  bifrost:
    image: maximhq/bifrost:v1.5.15-ubi9@sha256:39c757944a55f4a15d27a4851c482084472fb4bc1e2f450f2d0fe2075d0905d2
    command: ["-host", "0.0.0.0", "-port", "8080", "-app-dir", "/app/data"]
    depends_on:
      mock-openai:
        condition: service_started
    environment:
      # Synthetic local-only values. NOT secrets and NOT real provider keys.
      MOCK_OPENAI_API_KEY: "local-mock-not-a-secret"
      BIFROST_ENCRYPTION_KEY: "devgateway-local-demo-encryption-key-32b"
    volumes:
      - ./config.local-demo.json:/app/data/config.json:ro
    ports:
      - "43181:8080"
