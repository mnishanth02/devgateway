global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector-otlp-metrics
    static_configs:
      - targets:
          - otel-collector:9464
        labels:
          component: otel-collector
          signal: otlp-metrics
  - job_name: otel-collector-self
    static_configs:
      - targets:
          - otel-collector:8888
        labels:
          component: otel-collector
          signal: collector-self-metrics
  - job_name: track1-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - bifrost:8080
        labels:
          component: gateway
          service: bifrost
  # Pending Track 1 local service metrics endpoints. Enable these targets when
  # the services are added to docker-compose.local.yml and expose /metrics.
  # - job_name: track1-control-api
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: [control-api:3000]
  #       labels: { component: control-plane, service: control-api }
  # - job_name: track1-tool-broker
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: [tool-broker:3000]
  #       labels: { component: tools, service: tool-broker }
  # - job_name: track1-eval-runner
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: [eval-runner:3000]
  #       labels: { component: eval, service: eval-runner }
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
